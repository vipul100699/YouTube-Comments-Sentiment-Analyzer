data_ingestion:
  test_size: 0.2 # Percentage of data to use for testing

model_building:
  ngram_range: [1, 3] # N-gram range for TF-IDF vectorizer (unigrams, bigrams, trigrams)
  max_features: 1000 # Maximum number of features to keep in TF-IDF
  learning_rate: 0.09 # Learning rate for LightGBM
  max_depth: 20 # Maximum tree depth for LightGBM
  n_estimators: 367 # Number of boosting iterations for LightGBM